name: Rust packaged web route parity

on:
  push:
    branches: [fix/rust-core-route-parity]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  first-call:
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      RUSTVANI_CACHE_DIR: /tmp/sidevoice-rustvani-cache
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: sidevoice/sidevoice-web
          ref: 4ae0911d4946db84f9523489966f18d1b137be51
          path: peer/web
      - name: Build Core with committed sources
        run: |
          set -euo pipefail
          test "$(git -C peer/web rev-parse HEAD)" = 4ae0911d4946db84f9523489966f18d1b137be51
          rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt
          sudo apt-get update
          sudo apt-get install -y libopus-dev pkg-config
          python3 scripts/stage_rust_models.py "$RUSTVANI_CACHE_DIR"
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo build --locked --bin sidevoice-core-rust
      - name: Build offline fixture image
        run: docker build -f tests/rust_route_parity.Dockerfile -t sidevoice-route-parity .
      - name: Exercise first call preflight and socket join without external network
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --tmpfs /tmp \
            -e RUSTVANI_CACHE_DIR=/models \
            -v "$RUSTVANI_CACHE_DIR:/models:ro" \
            -v "$GITHUB_WORKSPACE:/workspace:ro" -w /workspace \
            sidevoice-route-parity /opt/route-venv/bin/python tests/rust_route_parity_hosted.py \
            /workspace/target/debug/sidevoice-core-rust \
            /workspace/peer/web/apps/web/src/services/room-session-controller.js
