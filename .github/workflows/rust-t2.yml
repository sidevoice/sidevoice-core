name: Rust T2 catalogue and settings

on:
  push:
    branches: [feat/rust-core-t2-models]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      RUSTVANI_CACHE_DIR: /tmp/sidevoice-rustvani-cache
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt
      - name: Stage verified detector assets for the locked Rustvani build
        run: python3 scripts/stage_rust_models.py "$RUSTVANI_CACHE_DIR"
      - name: Verify committed formatting and lockfile
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo tree --locked >/dev/null
      - name: Lint and compile the selected feature set
        run: |
          set -euo pipefail
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --no-run
          cargo build --locked --bin sidevoice-core-rust
      - name: Execute Rust tests without network access
        run: |
          set -euo pipefail
          found=0
          for test_binary in target/debug/deps/sidevoice_core-* target/debug/deps/sidevoice_core_rust-*; do
            if [[ ! -x "$test_binary" ]]; then
              continue
            fi
            found=1
            test_binary_rel="${test_binary#"$GITHUB_WORKSPACE"/}"
            docker run --rm --network none --read-only --tmpfs /tmp \
              -v "$GITHUB_WORKSPACE:/workspace:ro" \
              -w /workspace \
              ubuntu:24.04@sha256:a853f94d226358a79c740cfc7bce0c289748f3fe3488d921d038ccd752c61b60 \
              "/workspace/$test_binary_rel" --test-threads=1
          done
          test "$found" -eq 1
