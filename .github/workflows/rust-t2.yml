name: Rust T2 catalogue and settings

on:
  push:
    branches: [feat/rust-core-t2-models]
  workflow_dispatch:
    inputs:
      bootstrap_format:
        description: Generate a formatting patch artifact only
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      RUSTVANI_CACHE_DIR: /tmp/sidevoice-rustvani-cache
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt
      - name: Stage verified detector assets for the locked Rustvani build
        run: python3 scripts/stage_rust_models.py "$RUSTVANI_CACHE_DIR"
      - name: Generate hosted formatting patch (transient bootstrap)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap_format }}
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --binary -- rust > "$RUNNER_TEMP/t2-rust-format.patch"
          test -s "$RUNNER_TEMP/t2-rust-format.patch"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap_format }}
        with:
          name: t2-rust-format-patch
          path: ${{ runner.temp }}/t2-rust-format.patch
          if-no-files-found: error
      - name: Verify committed formatting and lockfile
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.bootstrap_format != true }}
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo tree --locked >/dev/null
      - name: Lint and compile the selected feature set
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.bootstrap_format != true }}
        run: |
          set -euo pipefail
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --lib --no-run
          cargo build --locked --bin sidevoice-core-rust
      - name: Execute Rust tests without network access
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.bootstrap_format != true }}
        run: |
          set -euo pipefail
          found=0
          for test_binary in target/debug/deps/sidevoice_core-*; do
            if [[ ! -x "$test_binary" ]]; then
              continue
            fi
            found=1
            test_binary_rel="${test_binary#"$GITHUB_WORKSPACE"/}"
            docker run --rm --network none --read-only --tmpfs /tmp \
              -v "$GITHUB_WORKSPACE:/workspace:ro" \
              -w /workspace \
              ubuntu:24.04@sha256:a853f94d226358a79c740cfc7bce0c289748f3fe3488d921d038ccd752c61b60 \
              "/workspace/$test_binary_rel" --test-threads=1
          done
          test "$found" -eq 1
