name: Rust T2 catalogue and settings

on:
  push:
    branches: [feat/rust-core-t2-models]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      RUSTVANI_CACHE_DIR: /tmp/sidevoice-rustvani-cache
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt
      - name: Stage verified detector assets for the locked Rustvani build
        run: python3 scripts/stage_rust_models.py "$RUSTVANI_CACHE_DIR"
      - name: Format sources and refresh a stale dependency lock
        run: |
          set -euo pipefail
          cargo fmt --all
          if ! cargo tree --locked >/dev/null 2>&1; then
            cargo generate-lockfile
          fi
      - name: Check the selected feature set and pure rule vectors
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --locked --bin sidevoice-core-rust
      - name: Save hosted formatting and lockfile output
        if: always()
        run: |
          set -euo pipefail
          git diff --binary -- Cargo.lock rust/lib.rs rust/messages.rs rust/models.rs > "$RUNNER_TEMP/t2-hosted-adjustments.patch"
          cp Cargo.lock "$RUNNER_TEMP/Cargo.lock"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: rust-t2-hosted-adjustments
          path: |
            ${{ runner.temp }}/t2-hosted-adjustments.patch
            ${{ runner.temp }}/Cargo.lock
          retention-days: 7
          if-no-files-found: error
