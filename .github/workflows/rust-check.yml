name: Rust Core check

on:
  pull_request:
    paths:
      - rust/**
      - vendor/**
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - rust-toolchain*
      - assets/**
      - scripts/stage_rust_models.py
      - tests/rust_*
      - tests/rust_*/**
      - tests/fixtures/**
      - tools/rust_native_bundle.py
      - .github/workflows/rust-*.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-check:
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      RUSTVANI_CACHE_DIR: /tmp/sidevoice-rustvani-cache
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned toolchain and native codec dependency
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt
          sudo apt-get update
          sudo apt-get install -y libopus-dev pkg-config
          python3 scripts/stage_rust_models.py "$RUSTVANI_CACHE_DIR"
      - name: Format, lockfile, lint and test
        run: |
          set -euo pipefail
          cargo fmt --package sidevoice-core --check
          rustfmt --edition 2021 --check tests/rust_library_host/src/main.rs
          cargo tree --locked >/dev/null
          cargo clippy --locked --all-targets -- -D warnings
          test -s /etc/ssl/certs/ca-certificates.crt
          export SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
          cargo test --locked
      - name: Prove exact Git host, vendored SDK and standalone signal
        if: github.event_name == 'workflow_dispatch'
        env:
          CORE_REV: ${{ github.sha }}
        run: |
          set -euo pipefail
          host_dir="$RUNNER_TEMP/core-library-host"
          mkdir -p "$host_dir/src"
          python3 - "$CORE_REV" "$host_dir" <<'PY'
          import pathlib, sys
          revision, host_dir = sys.argv[1], pathlib.Path(sys.argv[2])
          template = pathlib.Path('tests/rust_library_host/Cargo.toml.in').read_text()
          (host_dir / 'Cargo.toml').write_text(template.replace('CORE_REV', revision))
          PY
          cp tests/rust_library_host/src/main.rs "$host_dir/src/main.rs"
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target"
          cargo generate-lockfile --manifest-path "$host_dir/Cargo.toml"
          cargo metadata --locked --format-version 1 --manifest-path "$host_dir/Cargo.toml" \
            > "$RUNNER_TEMP/core-library-host-metadata.json"
          python3 - "$RUNNER_TEMP/core-library-host-metadata.json" "$CORE_REV" <<'PY'
          import json, pathlib, sys
          packages = json.loads(pathlib.Path(sys.argv[1]).read_text())['packages']
          revision = sys.argv[2]
          core = next(package for package in packages if package['name'] == 'sidevoice-core')
          sdk = next(package for package in packages if package['name'] == 'elevenlabs-sdk')
          assert core['source'] and core['source'].endswith('#' + revision), core['source']
          assert sdk['source'] == core['source'], sdk['source']
          assert sdk['manifest_path'].endswith('/vendor/elevenlabs-sdk/Cargo.toml'), sdk['manifest_path']
          print('exact Git Core and vendored ElevenLabs SDK selected')
          PY
          cargo run --locked --manifest-path "$host_dir/Cargo.toml" -- "$RUNNER_TEMP/core-library-state"
          cargo build --locked --bin sidevoice-core-rust
          standalone_state="$RUNNER_TEMP/core-standalone-signal"
          standalone_pid=
          cleanup_standalone() {
            if [ -n "$standalone_pid" ]; then
              kill "$standalone_pid" 2>/dev/null || true
              wait "$standalone_pid" 2>/dev/null || true
            fi
          }
          trap cleanup_standalone EXIT
          target/debug/sidevoice-core-rust --data-dir "$standalone_state" --port 0 --idle-exit 0 \
            > "$RUNNER_TEMP/core-standalone-signal.log" 2>&1 &
          standalone_pid=$!
          for attempt in $(seq 1 100); do
            if test -s "$standalone_state/core.json"; then break; fi
            if ! kill -0 "$standalone_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/core-standalone-signal.log"
              exit 1
            fi
            sleep 0.1
          done
          test -s "$standalone_state/core.json"
          sleep 0.2
          kill -TERM "$standalone_pid"
          wait "$standalone_pid"
          standalone_pid=
          test ! -e "$standalone_state/core.json"
          test ! -e "$standalone_state/local.sock"
          echo 'standalone SIGTERM: ready, stopped, state cleared'
