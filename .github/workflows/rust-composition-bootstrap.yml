name: Rust composition bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-lock-format-check:
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      RUSTVANI_CACHE_DIR: /tmp/sidevoice-rustvani-cache
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Prepare hosted native toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt
          sudo apt-get update
          sudo apt-get install -y libopus-dev pkg-config
          python3 scripts/stage_rust_models.py "$RUSTVANI_CACHE_DIR"
      - name: Resolve combined lock and format in hosted runner
        run: |
          cargo metadata --format-version 1 >/dev/null
          cargo fmt --all
          git diff --binary > /tmp/composition.patch
          test -s /tmp/composition.patch
      - name: Upload generated text patch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: composition-generated-patch
          path: /tmp/composition.patch
          if-no-files-found: error
      - name: Check combined source with generated lock
        run: cargo clippy --locked --all-targets -- -D warnings
