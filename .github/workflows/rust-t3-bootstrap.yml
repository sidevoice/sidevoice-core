name: Rust T3 bootstrap

on:
  push:
    branches: [feat/rust-core-mvp]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      RUSTVANI_CACHE_DIR: /tmp/sidevoice-rustvani-cache
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt
      - run: python3 scripts/stage_rust_models.py "$RUSTVANI_CACHE_DIR"
      - name: Generate formatting and lockfile patch
        run: |
          cargo generate-lockfile
          cargo fmt --all
          git diff -- Cargo.lock rust Cargo.toml > t3-bootstrap.patch
      - name: Compile and lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t3-bootstrap-patch
          path: t3-bootstrap.patch
