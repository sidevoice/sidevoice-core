name: Rust T6 rendezvous contract

on:
  push:
    branches: [feat/rust-core-t6-relay, feat/rust-core-mvp]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-room-peer:
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      RUSTVANI_CACHE_DIR: /tmp/sidevoice-rustvani-cache
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Prepare pinned toolchain and native assets
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal
          rustup component add --toolchain 1.98.1 rustfmt clippy
          sudo apt-get update
          sudo apt-get install -y libopus-dev pkg-config
          python3 scripts/stage_rust_models.py "$RUSTVANI_CACHE_DIR"
      - name: Bootstrap combined lock and formatting on hosted runner
        run: |
          cargo metadata --format-version 1 >/dev/null
          cargo fmt --all
          git diff --binary > /tmp/composition.patch
          test -s /tmp/composition.patch
      - name: Upload generated composition patch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: composition-generated-patch
          path: /tmp/composition.patch
          if-no-files-found: error
      - name: Check Rust and build Core
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --locked --bin sidevoice-core-rust
      - name: Prepare pinned local Socket.IO peer
        run: |
          set -euo pipefail
          docker build -f tests/rust_t6.Dockerfile -t sidevoice-rust-t6 .
          docker run --rm --network none sidevoice-rust-t6 /opt/t6-venv/bin/python -c \
            'import importlib.metadata as m; assert m.version("python-socketio") == "5.17.0"; assert m.version("aiohttp") == "3.13.5"'
      - name: Exercise relay and nested binary ACKs without external network
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --tmpfs /tmp \
            -e RUSTVANI_CACHE_DIR=/models -v "$RUSTVANI_CACHE_DIR:/models:ro" \
            -v "$GITHUB_WORKSPACE:/workspace:ro" -w /workspace \
            sidevoice-rust-t6 /opt/t6-venv/bin/python tests/rust_t6_hosted.py \
            /workspace/target/debug/sidevoice-core-rust
