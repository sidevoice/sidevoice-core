name: build

# The one producer of the core's release assets, called by nightly.yml (every push to main) and release-please.yml
# (a release). Per target: the tests, then `cargo xtask dist` (release binary, relocatable archive, verified by
# starting the core from it). Then `cargo xtask manifest`, one attestation over every asset, attach, read back,
# verify, publish. Dispatched by hand, or on a PR that changes the packaging, it builds and checks everything and
# publishes nothing.
on:
  workflow_call:
    inputs:
      tag:
        description: Where the assets go — `nightly`, or the draft vX.Y.Z release release-please created (built from that tag).
        type: string
        required: true
  workflow_dispatch:
  # A change to the packaging itself is proven on its PR, every target, publishing nothing.
  pull_request:
    paths: [xtask/**, .github/workflows/build.yml, .github/actions/setup/**]

permissions:
  contents: read

# Publications share one group and are never cancelled half-way; a hand-dispatched check has its own.
concurrency:
  group: ${{ inputs.tag && 'publish' || format('build-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  dist:
    name: Test and package (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: macos-aarch64
            runner: macos-14
          - target: linux-x86_64
            runner: ubuntu-24.04
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag && inputs.tag != 'nightly' && inputs.tag || github.sha }}
      - uses: ./.github/actions/setup
      - run: cargo test --locked
        env:
          SSL_CERT_FILE: ${{ runner.os == 'Linux' && '/etc/ssl/certs/ca-certificates.crt' || '/etc/ssl/cert.pem' }}
      - run: cargo xtask dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ matrix.target }}
          path: native/*.tar.zst
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Manifest, attest, publish
    needs: dist
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag && inputs.tag != 'nightly' && inputs.tag || github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dist-*
          path: assets
          merge-multiple: true
      - run: cargo xtask manifest assets ${{ inputs.tag && inputs.tag != 'nightly' && format('--tag {0}', inputs.tag) || '' }}
      - if: inputs.tag
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            assets/*.tar.zst
            assets/native-core-manifest.json
      - if: inputs.tag
        run: cp "${{ steps.attest.outputs.bundle-path }}" assets/attestation.sigstore.json
      - if: inputs.tag
        run: cargo xtask publish assets "$TAG"
