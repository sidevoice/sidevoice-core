name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12 .venv
      - run: uv pip install --python .venv/bin/python -e '.[test]'
      # Tests that need a rubasace/sidevoice checkout (the connector, the protocol package) skip here.
      - run: .venv/bin/python -m pytest -q -p no:warnings
