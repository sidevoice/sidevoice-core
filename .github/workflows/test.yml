name: test

# What runs when (RELEASING.md):
# - pull request: the unit tests on Linux.
# - push to main, manual run: the tests, then the wheel, sdist, model catalogue and resolver vectors; a green run on
#   main replaces the `nightly` pre-release.
# - a release (called by release-please.yml with the tag it created): the same, attached to that release.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-tag:
        description: The draft release release-please created (vX.Y.Z); its assets are built from that tag.
        type: string
        required: true

permissions:
  contents: read

concurrency:
  # Per ref. A release (github.workflow is the caller's, release-please) never shares a group with a push.
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-tag }}
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12 .venv
      - run: uv pip install --python .venv/bin/python -e '.[test]'
      # Tests that need the connector or web checkout skip here.
      - run: .venv/bin/python -m pytest -q -p no:warnings
      # The local socket's boundary is the OS user, and a test suite runs as one: here a second user, on a real core,
      # can neither open local.sock (nor read core.json) nor reach the connector link or the local routes over TCP.
      # The core's directory sits under a parent anyone may enter, so 0700/0600 are the only things in the way.
      - name: A second OS user cannot use the local socket nor link over TCP
        run: |
          set -euo pipefail
          install -d -m 0755 /tmp/sidevoice-ci
          .venv/bin/python -m sidevoice_core.server --port 8768 --data-dir /tmp/sidevoice-ci/core --idle-exit 0 \
            --launch-id ci > /tmp/sidevoice-ci.log 2>&1 &
          CORE=$!
          for _ in $(seq 1 120); do [ -f /tmp/sidevoice-ci/core/core.json ] && break; sleep 0.5; done
          ls -la /tmp/sidevoice-ci/core
          curl -sf --unix-socket /tmp/sidevoice-ci/core/local.sock http://localhost/api/local/health; echo
          sudo useradd --create-home sidevoice-other
          (cd /tmp && sudo -u sidevoice-other python3 -) <<'EOF'
          import errno, socket, urllib.error, urllib.request

          probe = socket.socket(socket.AF_UNIX)
          try:
              probe.connect('/tmp/sidevoice-ci/core/local.sock')
          except PermissionError as error:
              assert error.errno == errno.EACCES, error
              print('local.sock: EACCES')
          else:
              raise SystemExit('a second user opened local.sock')
          try:
              open('/tmp/sidevoice-ci/core/core.json').read()
          except PermissionError:
              print('core.json: EACCES')
          else:
              raise SystemExit('a second user read core.json')
          for method, path in [('GET', '/api/connectors/link/?EIO=4&transport=polling'), ('GET', '/api/local/health'),
                               ('POST', '/api/device/local/pair'), ('DELETE', '/api/device/local')]:
              request = urllib.request.Request('http://127.0.0.1:8768' + path, method=method, data=b'{}' if method == 'POST' else None,
                                               headers={'content-type': 'application/json'})
              try:
                  urllib.request.urlopen(request, timeout=10)
              except urllib.error.HTTPError as error:
                  assert error.code == 404, (path, error.code)
                  print(f'{method} {path} over TCP: 404')
              else:
                  raise SystemExit(f'{method} {path} answered a second user over TCP')
          EOF
          kill "$CORE"
          wait "$CORE"
          test ! -e /tmp/sidevoice-ci/core/local.sock

  package:
    name: Wheel, sdist, model catalogue and vectors
    needs: python
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      # Where the assets go: the release that called this, or the rolling `nightly` pre-release on a push to main.
      publish: ${{ steps.kind.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release-tag }}
      - uses: astral-sh/setup-uv@v6
      - id: kind
        run: echo "publish=${{ inputs.release-tag && 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'nightly' || '' }}" >> "$GITHUB_OUTPUT"
      - name: Wheel and sdist
        run: uv build --python 3.12 --out-dir dist
      - name: The model catalogue and the resolver vectors, as shipped in the wheel
        run: |
          set -euo pipefail
          PYTHONPATH=src uv run --no-project --python 3.12 python -c '
          from sidevoice_core.models.catalog import check, load
          problems = check(load())
          assert not problems, problems'
          cp src/sidevoice_core/models/catalog.json dist/models-catalog.json
          cp src/sidevoice_core/models/vectors.json dist/models-vectors.json
          WHEEL=$(ls dist/*.whl)
          unzip -p "$WHEEL" sidevoice_core/models/catalog.json | cmp - dist/models-catalog.json
          unzip -p "$WHEEL" sidevoice_core/models/vectors.json | cmp - dist/models-vectors.json
          (cd dist && sha256sum -- * > SHA256SUMS)
          ls -la dist; cat dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: sidevoice-core-dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # Only after the tests and the package passed. Pull requests never get here.
  publish:
    name: Publish (release or nightly)
    needs: package
    if: needs.package.outputs.publish != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.release-tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sidevoice-core-dist
          path: assets
      - name: Attach to the release, then publish it (a version with -rc.N is a pre-release, never latest)
        if: needs.package.outputs.publish == 'release'
        run: |
          set -euo pipefail
          gh release upload "$TAG" assets/* --clobber
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false --prerelease=false --latest
          fi
      - name: Replace the nightly pre-release (move its tag here, replace every asset)
        if: needs.package.outputs.publish == 'nightly'
        env:
          WHEN: ${{ github.event.head_commit.timestamp }}
        run: |
          set -euo pipefail
          if gh api "repos/$GH_REPO/git/ref/tags/nightly" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/nightly" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref=refs/tags/nightly -f sha="$GITHUB_SHA" >/dev/null
          fi
          NOTES="Snapshot of \`main\` at $GITHUB_SHA (committed $WHEN). Not a versioned release: the \`nightly\` tag moves to every commit on \`main\` whose CI passes, and these assets are replaced each time. Versioned releases are the \`vX.Y.Z\` ones."
          if gh release view nightly >/dev/null 2>&1; then
            gh release edit nightly --title "Nightly (main)" --notes "$NOTES" --prerelease --latest=false
            gh release upload nightly assets/* --clobber
            # Anything left from an older snapshot that this one did not replace (the wheel and sdist are named after the version).
            gh release view nightly --json assets -q '.assets[].name' | while read -r name; do
              [ -e "assets/$name" ] || gh release delete-asset nightly "$name" --yes
            done
          else
            gh release create nightly assets/* --verify-tag --title "Nightly (main)" --notes "$NOTES" \
              --prerelease --latest=false
          fi
