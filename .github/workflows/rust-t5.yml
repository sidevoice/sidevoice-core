name: Rust T5 voice and media

on:
  workflow_dispatch:
  push:
    branches: [feat/rust-core-mvp]

permissions:
  contents: read

jobs:
  voice:
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      RUSTVANI_CACHE_DIR: /tmp/sidevoice-rustvani-cache
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned toolchain and native codec dependency
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt
          sudo apt-get update
          sudo apt-get install -y libopus-dev pkg-config
      - name: Stage verified detector assets
        run: python3 scripts/stage_rust_models.py "$RUSTVANI_CACHE_DIR"
      - name: Resolve locked dependencies and format in Actions
        run: |
          cargo generate-lockfile
          cargo fmt --all
      - name: Preserve hosted lock and formatting result
        uses: actions/upload-artifact@v4
        with:
          name: rust-t5-hosted-sources
          path: |
            Cargo.lock
            rust/
          retention-days: 3
      - name: Check exact hosted build and library tests
        run: |
          set -euo pipefail
          test -s /etc/ssl/certs/ca-certificates.crt
          export SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --locked --bin sidevoice-core-rust
