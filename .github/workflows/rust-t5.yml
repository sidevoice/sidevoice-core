name: Rust T5 voice and media

on:
  workflow_dispatch:
  push:
    branches: [feat/rust-core-mvp]

permissions:
  contents: read

jobs:
  voice:
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      RUSTVANI_CACHE_DIR: /tmp/sidevoice-rustvani-cache
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: sidevoice/sidevoice-connector
          ref: ddb4bd1e0c95e7997787fe4ab98e7d812fbe2390
          path: peer/connector-js
      - name: Install pinned toolchain and native codec dependency
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt
          sudo apt-get update
          sudo apt-get install -y libopus-dev pkg-config
      - name: Stage verified detector assets
        run: python3 scripts/stage_rust_models.py "$RUSTVANI_CACHE_DIR"
      - name: Verify committed formatting and lockfile
        run: |
          cargo fmt --all --check
          cargo tree --locked >/dev/null
      - name: Check exact hosted build and library tests
        run: |
          set -euo pipefail
          test -s /etc/ssl/certs/ca-certificates.crt
          export SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --locked --bin sidevoice-core-rust
          cargo clippy --locked --all-targets --features hosted-fixtures -- -D warnings
          cargo build --locked --features hosted-fixtures --bin sidevoice-core-rust
      - name: Prepare pinned client and offline voice fixture
        run: |
          test "$(git -C peer/connector-js rev-parse HEAD)" = ddb4bd1e0c95e7997787fe4ab98e7d812fbe2390
          npm ci --prefix peer/connector-js
          docker build -f tests/rust_t5.Dockerfile -t sidevoice-rust-t5 .
      - name: Exercise recorded call and actual media transport without external network
        run: |
          docker network create --internal sidevoice-rust-t5 >/dev/null
          trap 'docker network rm sidevoice-rust-t5 >/dev/null' EXIT
          test "$(docker network inspect --format '{{.Internal}}' sidevoice-rust-t5)" = true
          docker run --rm --network sidevoice-rust-t5 --read-only --tmpfs /tmp \
            -e RUSTVANI_CACHE_DIR=/models \
            -v "$RUSTVANI_CACHE_DIR:/models:ro" \
            -v "$GITHUB_WORKSPACE:/workspace:ro" -w /workspace \
            sidevoice-rust-t5 /opt/t5-venv/bin/python tests/rust_t5_hosted.py \
            /workspace/target/debug/sidevoice-core-rust \
            /workspace/peer/connector-js/packages/connector/link.mjs \
            /workspace/peer/connector-js/packages/connector/link.mjs
