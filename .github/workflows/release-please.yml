name: release-please

# On every push to main: keep the "release X.Y.Z" PR up to date (version from feat/fix, changelog from the squashed
# PR titles). Merging that PR is the release: this run then creates the tag and a draft GitHub Release, and
# release.yml (called below) tests and builds the native core from the tag, attaches the attested assets and publishes
# the Release. RELEASING.md.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Never cancelled: a run that created a release must finish attaching its assets.
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR and release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
      - uses: actions/checkout@v4
        if: steps.release.outputs.prs_created == 'true'
      - name: Keep xtask's lock in step, then run the PR checks on the release PR (its own pushes start no workflow)
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # The action's own JSON array of the release PRs it created or updated (headBranchName, number, ...). Read
          # through env and jq, never fromJSON(): an empty output must not fail the job at expression time.
          PRS: ${{ steps.release.outputs.prs }}
        # xtask/ is its own workspace and records sidevoice-platform's version, which release-please does not move
        # (its `extra-files` toml updater did nothing on Cargo.lock), and `cargo xtask dist --locked` fails on a
        # stale lock. So copy the version release-please just wrote to the root Cargo.lock, commit it through the API (signed), and only then
        # dispatch the checks (a GITHUB_TOKEN commit starts none).
        # The branches come from the action's outputs, not from a label query: right after the PR is created the label
        # search lags and finds nothing (0.10.1). The same outputs cover a release PR that was only updated.
        run: |
          branches=$(jq -r '.[]?.headBranchName // empty' <<< "${PRS:-[]}")
          [ -n "$branches" ] || { echo "prs_created is true but the action returned no PR branch"; exit 1; }
          for branch in $branches; do
            git fetch --quiet origin "$branch"
            git checkout --quiet --detach "origin/$branch"
            version=$(awk '$0 == "name = \"sidevoice-platform\"" { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)
            [ -n "$version" ] || { echo "no sidevoice-platform version in Cargo.lock"; exit 1; }
            awk -v v="$version" '$0 == "name = \"sidevoice-platform\"" { print; getline; print "version = \"" v "\""; next } { print }' \
              xtask/Cargo.lock > xtask/Cargo.lock.new
            mv xtask/Cargo.lock.new xtask/Cargo.lock
            if ! git diff --quiet -- xtask/Cargo.lock; then
              # Through the API, so GitHub signs the commit (the signed-commits ruleset has no bypass actors).
              gh api -X PUT "repos/$GH_REPO/contents/xtask/Cargo.lock" \
                -f message="chore(xtask): lock sidevoice-platform $version" \
                -f branch="$branch" \
                -f sha="$(git rev-parse "HEAD:xtask/Cargo.lock")" \
                -f content="$(base64 -w0 xtask/Cargo.lock)" > /dev/null
            fi
            gh workflow run pr-title.yml --ref "$branch"
            gh workflow run ci.yml --ref "$branch"
          done

  assets:
    name: Release assets
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
