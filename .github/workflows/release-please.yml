name: release-please

# On every push to main: keep the "release X.Y.Z" PR up to date (version from feat/fix, changelog from the squashed
# PR titles). Merging that PR is the release: this run then creates the tag and a draft GitHub Release, and
# release.yml (called below) tests and builds the native core from the tag, attaches the attested assets and publishes
# the Release. RELEASING.md.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Never cancelled: a run that created a release must finish attaching its assets.
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR and release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
      - uses: actions/checkout@v4
        if: steps.release.outputs.prs_created == 'true'
      - name: Keep xtask's lock in step, then run the PR checks on the release PR (its own pushes start no workflow)
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # xtask/ is its own workspace and records sidevoice-platform's version, which release-please does not move
        # (its `extra-files` toml updater did nothing on Cargo.lock), and `cargo xtask dist --locked` fails on a
        # stale lock. So copy the version release-please just wrote to the root Cargo.lock, push, and only then
        # dispatch the checks (a GITHUB_TOKEN push starts none).
        # The release PR's branch is read from the PR itself: the action's `pr` output can be empty while
        # `prs_created` is true, and fromJSON('') then fails the whole job.
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for branch in $(gh pr list --state open --label 'autorelease: pending' --json headRefName --jq '.[].headRefName'); do
            git fetch --quiet origin "$branch"
            git checkout --quiet --detach "origin/$branch"
            version=$(awk '$0 == "name = \"sidevoice-platform\"" { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)
            [ -n "$version" ] || { echo "no sidevoice-platform version in Cargo.lock"; exit 1; }
            awk -v v="$version" '$0 == "name = \"sidevoice-platform\"" { print; getline; print "version = \"" v "\""; next } { print }' \
              xtask/Cargo.lock > xtask/Cargo.lock.new
            mv xtask/Cargo.lock.new xtask/Cargo.lock
            if ! git diff --quiet -- xtask/Cargo.lock; then
              git commit --quiet -m "chore(release): xtask lock to $version" xtask/Cargo.lock
              git push --quiet origin "HEAD:refs/heads/$branch"
            fi
            gh workflow run pr-title.yml --ref "$branch"
            gh workflow run ci.yml --ref "$branch"
          done

  assets:
    name: Release assets
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
