name: Rust Core compiled contract feasibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slice:
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain and codec dependency
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          sudo apt-get update
          sudo apt-get install -y libopus-dev pkg-config
      - name: Derive Rust contract types with the pinned JSON Schema generator
        run: |
          set -euo pipefail
          python3 tools/contract_slice.py check
          cargo install cargo-typify --version 0.8.0 --locked
          cargo typify contracts/generated/core-types.schema.json \
            --output rust/server/contract_types_generated.rs --no-builder
          rustfmt --edition 2021 rust/server/contract_types_generated.rs
          if git ls-files --error-unmatch rust/server/contract_types_generated.rs >/dev/null 2>&1; then
            git diff --exit-code -- rust/server/contract_types_generated.rs
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: core-contract-slice-rust-types
          path: rust/server/contract_types_generated.rs
          if-no-files-found: error
      - name: Compile actual Core adapters and exact schema shapes
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo tree --locked >/dev/null
          cargo check --locked --lib
          cargo test --locked contract_slice_preserves_representative_json_shapes
      - name: Compile generated TypeScript client and reject wrong operations
        working-directory: contracts/proof/ts
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          cp src/generated/core-http.d.ts /tmp/core-http-committed.d.ts
          npm run generate
          cmp /tmp/core-http-committed.d.ts src/generated/core-http.d.ts
          npm run check
          if npm run negative > /tmp/core-contract-ts-negative.log 2>&1; then
            echo 'invalid TypeScript operations compiled unexpectedly'
            exit 1
          fi
          test "$(grep -c 'error TS' /tmp/core-contract-ts-negative.log)" -ge 4
          cat /tmp/core-contract-ts-negative.log
      - name: Reject omitted Rust handler and missing generated route
        run: |
          set -euo pipefail
          cp rust/server/contract_slice_generated.rs /tmp/core-contract-routes.rs
          python3 - <<'PY'
          from pathlib import Path
          path = Path('rust/server/contract_slice_generated.rs')
          text = path.read_text()
          line = '        .route("/api/presentation/languages", get(H::get_presentation_languages))\n'
          assert text.count(line) == 1
          path.write_text(text.replace(line, ''))
          PY
          if python3 tools/contract_slice.py check; then
            echo 'missing generated registration was accepted'
            exit 1
          fi
          cp /tmp/core-contract-routes.rs rust/server/contract_slice_generated.rs
          negative_dir="$(mktemp -d)"
          git archive HEAD | tar -x -C "$negative_dir"
          python3 - "$negative_dir/rust/server.rs" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1])
          text = path.read_text()
          method = '''    async fn get_presentation_languages() -> Response {
                  presentation_languages().await.into_response()
              }

          '''
          assert text.count(method) == 1
          path.write_text(text.replace(method, ''))
          PY
          if CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" \
            cargo check --locked --lib --manifest-path "$negative_dir/Cargo.toml" \
            > /tmp/core-contract-rust-negative.log 2>&1; then
            echo 'missing required Rust handler compiled unexpectedly'
            exit 1
          fi
          grep -q 'E0046' /tmp/core-contract-rust-negative.log
          grep 'E0046' /tmp/core-contract-rust-negative.log
