name: Rust T0 foundation

on:
  push:
    branches: [feat/rust-core-mvp]
  workflow_dispatch:
    inputs:
      bootstrap_format_lock:
        description: Generate a combined formatting and lockfile patch artifact
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  detector:
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      RUSTVANI_CACHE_DIR: /tmp/sidevoice-rustvani-cache
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt
      - name: Stage verified model assets
        run: python3 scripts/stage_rust_models.py "$RUSTVANI_CACHE_DIR"
      - name: Generate hosted formatting and lockfile patch
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap_format_lock }}
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 > /dev/null
          cargo fmt --all
          git diff --binary -- Cargo.lock rust > "$RUNNER_TEMP/t1-fix-format-lock.patch"
          test -s "$RUNNER_TEMP/t1-fix-format-lock.patch"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap_format_lock }}
        with:
          name: t1-fix-format-lock-patch
          path: ${{ runner.temp }}/t1-fix-format-lock.patch
          if-no-files-found: error
      - name: Compile corrected source during bootstrap
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap_format_lock }}
        run: cargo clippy --all-targets -- -D warnings
      - name: Check sources and pinned fixture
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.bootstrap_format_lock != true }}
        run: |
          set -euo pipefail
          test -s tests/fixtures/hola-sala-16k.wav
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Build selected feature set
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.bootstrap_format_lock != true }}
        run: cargo build --locked --bin sidevoice-core-rust
      - name: Run synthetic Python/Rust state and trust contract without network
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.bootstrap_format_lock != true }}
        run: |
          set -euo pipefail
          docker build -f tests/rust_t1.Dockerfile -t sidevoice-rust-t1 .
          docker run --rm --network none --read-only --tmpfs /tmp \
            -v "$GITHUB_WORKSPACE:/workspace:ro" -w /workspace \
            sidevoice-rust-t1 /opt/t1-venv/bin/python tests/rust_t1_hosted.py \
            /workspace/target/debug/sidevoice-core-rust
      - name: Execute real detectors without network
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.bootstrap_format_lock != true }}
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --tmpfs /tmp \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$RUSTVANI_CACHE_DIR:/models:ro" \
            -w /workspace ubuntu:24.04@sha256:a853f94d226358a79c740cfc7bce0c289748f3fe3488d921d038ccd752c61b60 \
            /workspace/target/debug/sidevoice-core-rust --self-test \
            /workspace/tests/fixtures/hola-sala-16k.wav /models \
            | tee "$RUNNER_TEMP/detectors.json"
          python3 - "$RUNNER_TEMP/detectors.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))['detectors']
          assert data['sample_rate'] == 16000
          assert data['frames'] > 10
          assert data['max_voice_confidence'] > 0.5, data
          assert 0 <= data['smart_turn_probability'] <= 1, data
          assert data['smart_turn_complete'] is True, data
          print(data)
          PY
