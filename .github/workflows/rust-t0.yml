name: Rust T0 foundation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-t0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detector:
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      RUSTVANI_CACHE_DIR: /tmp/sidevoice-rustvani-cache
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt
          sudo apt-get update
          sudo apt-get install -y libopus-dev pkg-config
      - name: Stage verified model assets
        run: python3 scripts/stage_rust_models.py "$RUSTVANI_CACHE_DIR"
      - name: Check sources and pinned fixture
        run: |
          set -euo pipefail
          test -s tests/fixtures/hola-sala-16k.wav
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          test -s /etc/ssl/certs/ca-certificates.crt
          export SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
          cargo test --locked
      - name: Build selected feature set
        run: cargo build --locked --bin sidevoice-core-rust
      - name: Run synthetic Python/Rust state and trust contract without network
        run: |
          set -euo pipefail
          docker build -f tests/rust_t1.Dockerfile -t sidevoice-rust-t1 .
          docker run --rm --network none --read-only --tmpfs /tmp \
            -v "$GITHUB_WORKSPACE:/workspace:ro" -w /workspace \
            sidevoice-rust-t1 /opt/t1-venv/bin/python tests/rust_t1_hosted.py \
            /workspace/target/debug/sidevoice-core-rust
      - name: Execute real detectors without network
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --tmpfs /tmp \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$RUSTVANI_CACHE_DIR:/models:ro" \
            -w /workspace sidevoice-rust-t1 \
            /workspace/target/debug/sidevoice-core-rust --self-test \
            /workspace/tests/fixtures/hola-sala-16k.wav /models \
            | tee "$RUNNER_TEMP/detectors.json"
          python3 - "$RUNNER_TEMP/detectors.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))['detectors']
          assert data['sample_rate'] == 16000
          assert data['frames'] > 10
          assert data['max_voice_confidence'] > 0.5, data
          assert 0 <= data['smart_turn_probability'] <= 1, data
          assert data['smart_turn_complete'] is True, data
          print(data)
          PY
