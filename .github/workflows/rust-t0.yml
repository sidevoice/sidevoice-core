name: Rust T0 foundation

on:
  push:
    branches: [feat/rust-core-mvp]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detector:
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      RUSTVANI_CACHE_DIR: /tmp/sidevoice-rustvani-cache
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy rustfmt
      - name: Stage verified model assets
        run: python3 scripts/stage_rust_models.py "$RUSTVANI_CACHE_DIR"
      - name: Check sources and pinned fixture
        run: |
          set -euo pipefail
          test -s tests/fixtures/hola-sala-16k.wav
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Build selected feature set
        run: cargo build --locked --bin sidevoice-core-rust
      - name: Execute real detectors without network
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --tmpfs /tmp \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$RUSTVANI_CACHE_DIR:/models:ro" \
            -w /workspace ubuntu:24.04 \
            /workspace/target/debug/sidevoice-core-rust --self-test \
            /workspace/tests/fixtures/hola-sala-16k.wav /models \
            | tee "$RUNNER_TEMP/detectors.json"
          python3 - "$RUNNER_TEMP/detectors.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))['detectors']
          assert data['sample_rate'] == 16000
          assert data['frames'] > 10
          assert data['max_voice_confidence'] > 0.5, data
          assert 0 <= data['smart_turn_probability'] <= 1, data
          print(data)
          PY
