name: ci

# Every pull request: lint once, then on every target the tests and the release packaging, exactly as a release
# builds it (on Linux also started on the oldest distribution it supports), publishing nothing. What passes here is what merging publishes (release.yml).
on:
  pull_request:
    branches: [main]
  # release-please.yml dispatches it on the release PR, whose pushes start no workflow.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format and Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test and package (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: macos-aarch64, runner: macos-15 }
          - { target: linux-x86_64, runner: ubuntu-24.04 }
          - { target: linux-aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup
      - run: cargo test --locked --workspace --all-features
      - run: cargo xtask dist
      # The Linux archive on the oldest distribution it supports (glibc floor, xtask/src/glibc.rs).
      - if: runner.os == 'Linux'
        run: cargo xtask verify-floor native/sidevoice-core-${{ matrix.target }}.tar.zst

  # Windows support (sidevoice-core#82) is being built: this job builds the core and runs its tests on Windows and is
  # expected to fail until the platform work lands. It is not part of the release.
  windows:
    name: Test (windows-x86_64)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup
      - run: cargo build --locked -p sidevoice-core
      - run: cargo test --locked -p sidevoice-core

  # The operating-system code shared with the connector (`platform/`, sidevoice-platform) already builds and passes on
  # Windows, on its own: this job is green while the whole core's, above, is not yet. Lint included, since the lint job
  # above sees Linux only.
  windows-platform:
    name: Test sidevoice-platform (windows-x86_64)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup
      - run: cargo clippy --locked -p sidevoice-platform --all-targets -- -D warnings
      - run: cargo test --locked -p sidevoice-platform
