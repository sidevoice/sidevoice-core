name: ci

# Every pull request: lint once, then on every target the tests and the release packaging, exactly as a release
# builds it (on Linux also started on the oldest distribution it supports), publishing nothing. What passes here is what merging publishes (release.yml).
on:
  pull_request:
    branches: [main]
  # release-please.yml dispatches it on the release PR, whose pushes start no workflow.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format and Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path xtask/Cargo.toml --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy --locked --manifest-path xtask/Cargo.toml --all-targets -- -D warnings

  test:
    name: Test and package (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: macos-aarch64, runner: macos-15 }
          - { target: linux-x86_64, runner: ubuntu-24.04 }
          - { target: linux-aarch64, runner: ubuntu-24.04-arm }
          # Native, MSVC, the C runtime linked statically (.cargo/config.toml).
          - { target: windows-x86_64, runner: windows-2025 }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup
      # The lint job sees Linux only: the code that is Windows-only (platform/, the core's own cfg(windows)) is linted here.
      - if: runner.os == 'Windows'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - if: runner.os == 'Windows'
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Enable short names on the Windows test volume
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Use the same explicit temp directory for Rust and for the volume configuration below.
          $testTemp = [System.IO.Path]::GetTempPath()
          $volume = [System.IO.Path]::GetPathRoot($testTemp).TrimEnd('\')
          # Hosted runners are disposable admins. Per-volume mode makes the setting below authoritative.
          fsutil 8dot3name set 2
          if ($LASTEXITCODE -ne 0) { throw "Cannot enable per-volume 8.3 configuration" }
          fsutil 8dot3name set $volume 0
          if ($LASTEXITCODE -ne 0) { throw "Cannot enable 8.3 names on $volume" }
          fsutil 8dot3name query $volume
          if ($LASTEXITCODE -ne 0) { throw "Cannot verify 8.3 configuration on $volume" }
          "TMP=$testTemp" >> $env:GITHUB_ENV
          "TEMP=$testTemp" >> $env:GITHUB_ENV
          "SIDEVOICE_REQUIRE_8DOT3=1" >> $env:GITHUB_ENV
      - run: cargo test --locked --workspace --all-features
      - name: Prove Windows 8.3 removal alias rejection
        if: runner.os == 'Windows'
        run: cargo test --locked -p sidevoice-platform --all-features removal::tests::windows_short_name_cannot_authorize_an_unlisted_long_name -- --exact --nocapture
      - run: cargo test --locked --manifest-path xtask/Cargo.toml
      - run: cargo xtask dist
      # The Linux archive on the oldest distribution it supports (glibc floor, xtask/src/glibc.rs).
      - if: runner.os == 'Linux'
        run: cargo xtask verify-floor native/sidevoice-core-${{ matrix.target }}.tar.zst
