name: compat

# Every week: this core against the latest published release of the connector and of the web client
# (`cargo xtask compat`, xtask/src/compat.rs); on failure, open an issue labelled compat (or comment on the open one).
on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: compat
  cancel-in-progress: false

jobs:
  compat:
    name: Against the released connector and web client
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/setup
      - run: cargo xtask compat
      # Only main's runs say anything in an issue: a run of a branch (workflow_dispatch) reports in its own log.
      - if: failure() && github.ref == 'refs/heads/main'
        run: cargo xtask compat-report
