[package]
edition = "2024"
name = "elevenlabs-sdk"
version = "0.1.0"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Comprehensive async Rust SDK for ElevenLabs API with TTS, STT, voice management, and WebSocket streaming"
homepage = "https://github.com/longcipher/elevenlabs-sdk-rs"
documentation = "https://docs.rs/elevenlabs-sdk"
readme = "README.md"
keywords = [
    "elevenlabs",
    "tts",
    "stt",
    "voice",
    "websocket",
]
categories = [
    "api-bindings",
    "asynchronous",
    "multimedia::audio",
    "network-programming",
]
license = "Apache-2.0"
repository = "https://github.com/longcipher/elevenlabs-sdk-rs"

[lib]
name = "elevenlabs_sdk"
