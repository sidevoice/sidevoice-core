path = "examples/streaming.rs"

[[example]]
name = "text_to_speech"
path = "examples/text_to_speech.rs"

[[example]]
name = "voices"
path = "examples/voices.rs"

[[example]]
name = "websocket_tts"
path = "examples/websocket_tts.rs"

[[test]]
