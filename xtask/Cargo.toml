[package]
name = "xtask"
version = "0.0.0"
edition = "2021"
publish = false
description = "Build tooling for the core: detector models, relocatable release archives and their manifest."

[dependencies]
# The DLLs a Windows binary imports (libraries.rs).
object = { version = "0.40", default-features = false, features = ["read_core", "pe", "std"] }
# Shared release targets and asking the core to leave (on Windows by its stop event).
sidevoice-platform = { path = "../platform" }
# The core's local channel, a Unix socket or a named pipe, from `verify`.
interprocess = "2.4"
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
