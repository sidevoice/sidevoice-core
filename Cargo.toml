[package]
name = "sidevoice-core"
version = "0.7.0"
edition = "2021"
rust-version = "1.98"
publish = false

# The core, and beside it the operating-system code it shares with the connector (`platform/`, `sidevoice-platform`),
# released together: one version, one `vX.Y.Z` tag (RELEASING.md). `xtask` is its own build, outside.
[workspace]
members = ["platform"]
exclude = ["xtask"]

[lib]
path = "rust/lib.rs"

[[bin]]
name = "sidevoice-core-rust"
path = "rust/main.rs"

# Integration tests are the files in tests/, found by Cargo. Each drives the binary as a process or the router
# in-process, with every peer (browser, connector) a local fake written in Rust. `compat` runs against the
# latest published connector and web client through `cargo xtask compat` (ignored otherwise).

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
async-trait = "=0.1.89"
axum = { version = "0.8", features = ["ws"] }
base64 = "=0.22.1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
fs2 = "0.4"
futures-util = "=0.3.32"
libc = "0.2"
opentelemetry = { version = "0.31", default-features = false, features = ["trace", "metrics"] }
opentelemetry-http = { version = "0.31", default-features = false }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["http-proto", "trace", "metrics"] }
opentelemetry_sdk = { version = "0.31", default-features = false, features = ["trace", "metrics"] }
p256 = { version = "0.13", features = ["ecdsa", "pem", "pkcs8"] }
percent-encoding = "=2.3.2"
rand = "0.8"
reqwest = { version = "=0.13.0", default-features = false, features = ["json", "multipart", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "=0.10.9"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync", "io-util"] }
tower = { version = "=0.5.3", features = ["retry", "util"] }
tokio-tungstenite = { version = "0.30", features = ["connect", "rustls-tls-native-roots"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }
url = "2"
# This user and the local channel, shared with the connector (rust/platform re-exports them).
sidevoice-platform = { path = "platform" }

[dev-dependencies]
opentelemetry-proto = { version = "0.31", default-features = false, features = ["gen-tonic-messages", "trace", "metrics"] }
prost = "0.14"
wiremock = "=0.6.5"
