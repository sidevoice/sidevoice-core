[package]
name = "sidevoice-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
publish = false

[lib]
path = "rust/lib.rs"

[[bin]]
name = "sidevoice-core-rust"
path = "rust/main.rs"

[dependencies]
hound = "3.5.1"
rustvani = { git = "https://github.com/Allenmylath/rustvani.git", rev = "d01f33e671f7a4d8a128e7bfe55dbf0e8963cb21", default-features = false, features = ["vad-silero-ort"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
