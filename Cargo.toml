[package]
name = "sidevoice-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
publish = false

[lib]
path = "rust/lib.rs"

[[bin]]
name = "sidevoice-core-rust"
path = "rust/main.rs"

[dependencies]
async-openai = { version = "=0.41.0", default-features = false, features = ["audio", "model", "rustls", "middleware"] }
base64 = "=0.22.1"
elevenlabs-sdk = "=0.1.0"
futures-util = "=0.3.31"
httpdate = "=1.0.3"
hound = "3.5.1"
percent-encoding = "=2.3.2"
rand = "=0.9.2"
reqwest = { version = "=0.13.0", default-features = false, features = ["json", "multipart", "rustls"] }
rustvani = { git = "https://github.com/Allenmylath/rustvani.git", rev = "d01f33e671f7a4d8a128e7bfe55dbf0e8963cb21", default-features = false, features = ["vad-silero-ort"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "=0.10.9"
tower = { version = "=0.5.3", features = ["retry"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }
unicode-normalization = "0.1"

[dev-dependencies]
wiremock = "=0.6.5"
