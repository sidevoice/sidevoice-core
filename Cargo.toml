[package]
name = "sidevoice-core"
version = "0.19.1"
edition = "2021"
rust-version = "1.98"
publish = false

# The core, and beside it the operating-system code it shares with the connector (`platform/`, `sidevoice-platform`),
# released together: one version, one `vX.Y.Z` tag (RELEASING.md). `xtask` is its own build, outside.
[workspace]
members = ["platform"]
exclude = ["xtask"]

[lib]
path = "rust/lib.rs"

[[bin]]
name = "sidevoice-core"
path = "rust/main.rs"

# Integration tests are the files in tests/, found by Cargo. Each drives the binary as a process or the router
# in-process, with every peer (browser, connector) a local fake written in Rust. `compat` runs against the
# latest published connector and web client through `cargo xtask compat` (ignored otherwise).

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
async-trait = "=0.1.89"
axum = { version = "0.8", features = ["ws"] }
base64 = "=0.22.1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = "=0.3.32"
# The host's network interfaces with their flags (platform/network), the same on every OS. No default features: the
# gateway, DNS, Apple SystemConfiguration and Android extras are not used.
netdev = { version = "0.46", default-features = false }
# The user's home directory, the same on every OS (runtime/config).
dirs = "7"
opentelemetry = { version = "0.31", default-features = false, features = ["trace", "metrics"] }
opentelemetry-http = { version = "0.31", default-features = false }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["http-proto", "trace", "metrics"] }
opentelemetry_sdk = { version = "0.31", default-features = false, features = ["trace", "metrics"] }
p256 = { version = "0.13", features = ["ecdsa", "pem", "pkcs8"] }
percent-encoding = "=2.3.2"
rand = "0.8"
reqwest = { version = "=0.13.0", default-features = false, features = ["json", "multipart", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
secrecy = { version = "0.10", features = ["serde"] }
# Crash reports (rust/crash): the maintained SDK's event and envelope types and its DSN only. No default features: no
# transport, panic or context integration and no client is ever started; the event is built from the record's closed
# field list and posted by `crash::report` (the same approach as the desktop app's).
sentry = { version = "0.49", default-features = false }
# The frames of a panic with their addresses (resolved after the hook, off the dying thread) and the modules loaded at
# start (rust/crash/trace.rs); the maintained crates the SDK's own integrations are made of, without them.
backtrace = "0.3"
findshlibs = "0.10"
sha2 = "=0.10.9"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync", "io-util"] }
tower = { version = "=0.5.3", features = ["retry", "util"] }
tokio-tungstenite = { version = "0.30", features = ["connect", "rustls-tls-native-roots"] }
thiserror = "2"
tracing = "0.1"
# `tracing-log` stays off: no `LogTracer`, so the `log` lines of rustls, tungstenite and reqwest never reach a file.
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "env-filter", "fmt", "std"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }
url = "2"
# This user and the local channel, shared with the connector (rust/platform re-exports them).
sidevoice-platform = { path = "platform" }

[target.'cfg(unix)'.dev-dependencies]
# Signals sent to a core process, and its pid (tests/support).
libc = "0.2"

[dev-dependencies]
opentelemetry-proto = { version = "0.31", default-features = false, features = ["gen-tonic-messages", "trace", "metrics"] }
prost = "0.14"
wiremock = "=0.6.5"

# Crash reports (rust/crash.rs, RELEASING.md): line tables for file and line, and no stripping here (`strip = "none"`; on MSVC a
# build that strips links without a PDB). `cargo xtask dist` splits the debug sections off the binary it ships (xtask/src/debug_files.rs:
# the symbol table stays, so frames have names with or without Sentry) and leaves them beside the archive for the upload.
[profile.release]
debug = "line-tables-only"
strip = "none"
