[package]
name = "sidevoice-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
publish = false

[lib]
path = "rust/lib.rs"

[[bin]]
name = "sidevoice-core-rust"
path = "rust/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
fs2 = "0.4"
hostname = "0.4"
hound = "3.5.1"
libc = "0.2"
p256 = { version = "0.13", features = ["ecdsa", "pem", "pkcs8"] }
percent-encoding = "2"
rand = "0.8"
rusqlite = { version = "0.37", features = ["bundled"] }
rustix = { version = "1", features = ["process"] }
rustvani = { git = "https://github.com/Allenmylath/rustvani.git", rev = "d01f33e671f7a4d8a128e7bfe55dbf0e8963cb21", default-features = false, features = ["vad-silero-ort"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
uuid = { version = "1", features = ["v4"] }
url = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
