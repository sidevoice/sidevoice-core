[package]
name = "sidevoice-platform"
# Moved by release-please with the core's (a workspace member is released with it, tagged `vX.Y.Z`): never by hand.
version = "0.14.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "The operating-system code Sidevoice's crates share: this user, the private directories and files it keeps, and the local channel between its processes."

# Only what the shared concerns need: whoever depends on this crate (the core by path, the connector by the git tag of
# a core release) pulls nothing else.
[dependencies]
# Shared child groups/jobs and hidden Windows launches, extracted from the connector.
process-wrap = { version = "10", default-features = false, features = ["tokio1", "process-group", "job-object", "creation-flags", "kill-on-drop"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
tokio = { version = "1", features = ["process", "io-util", "time", "macros"] }
# The local channel (ipc): Unix sockets and Windows named pipes behind one API.
interprocess = { version = "2.4", features = ["tokio"] }
# The login name and the host name (user), the same on every OS.
gethostname = "1"
whoami = "2"
# The OS's standard places for a program's data (data_dir) and this user's runtime directory (ipc: where its sockets
# go), and the short name an endpoint's directory (Unix) or pipe (Windows) takes from its data directory.
dirs = "7"
hex = "0.4"
sha2 = "0.10"
# A record written as JSON (fs: `write_json`).
serde = "1"
serde_json = "1"
# A record's staging file (fs): a fresh name beside the record, created by `open_private`, removed on failure (the
# rename too), renamed over it.
tempfile = "3"

# Unix: the effective uid (user), the open flags (fs) and sending `SIGTERM` (stop), with no `unsafe` of ours; hearing it
# (stop), `tokio`.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process", "fs"] }
tokio = { version = "1", features = ["signal"] }
# Who the administrators are (fs): an owner's account and the admin groups with their members, read from the system's
# user and group databases (`getpwuid_r`, `getgrnam_r`, `getgrgid_r`), never `/etc/group` parsed by hand.
nix = { version = "0.31", default-features = false, features = ["user"] }

# Only the maintained constant binding: rustix does not name macOS O_SEARCH yet; calls remain safe rustix APIs.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
# An extended ACL's entries (fs): on macOS they grant beyond the mode bits, which do not show them.
exacl = "0.13"

# Windows: this process's user and file owners (user); the pipe's security descriptor, and whether a
# pipe peer's process is this user's (ipc); the stop event, and a channel from the thread that waits on it (stop).
[target.'cfg(windows)'.dependencies]
widestring = "1"
# The flags type process-wrap itself uses; no native types escape the public API.
windows = { version = "0.62", features = ["Win32_System_Threading"] }
tokio = { version = "1", features = ["sync"] }
# How many names a file has, and which file a handle is (fs): `winapi-util` (walkdir, ripgrep), no `unsafe` of ours.
winapi-util = "0.1"
windows-sys = { version = "0.61", features = [
    # NtCreateFile relative to a held directory handle (fs: `open_relative`); Win32 has no handle-relative open.
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_WindowsProgramming",
] }

[features]
# What tests do to files and a program never does (fs: `TestFiles`): for a dependent's tests, through a dev-dependency
# on this crate with this feature. Never in a release build.
test-support = []

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "time"] }
